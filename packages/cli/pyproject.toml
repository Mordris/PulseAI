[project]
name = "pulseai"
version = "0.1.0"
description = "PulseAI engine CLI: daily AI and software research routine for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "PulseAI contributors" }]
dependencies = [
    "aiolimiter>=1.3.0",
    "anyio>=4.15.1",
    "coloraide>=8.13.1",
    "courlan>=1.4.0",
    "defusedxml>=0.7.1",
    "feedparser>=6.0.14",
    "hishel[httpx]>=1.4.0",
    "httpx>=0.28.1",
    "jmespath>=1.1.0",
    "jsonschema[format-nongpl]>=4.26.0",
    "nh3>=0.3.7",
    "packaging>=26.3",
    "protego>=0.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-slugify>=9.1.3",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

[project.scripts]
pulse = "pulseai.cli:app"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseai"]

[tool.hatch.build.targets.wheel.force-include]
"../../schema" = "pulseai/_data/schema"
"../../defaults" = "pulseai/_data/defaults"
"../../taxonomy" = "pulseai/_data/taxonomy"
"../../sources" = "pulseai/_data/sources"
"../../locales" = "pulseai/_data/locales"
