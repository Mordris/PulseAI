        What's changed\\n\\n- Added `oidc.user_id_claim` to the Claude apps gateway,
        to identify people by an id_token claim other than `sub`, such as Microsoft
        Entra ID's `oid`\\n- Added click to send: in fullscreen, clicking the \\\"to
        send now\\\" hint under a queued message sends it right away, as its key does\\n-
        Fixed managed settings and organization policy not being fetched for the rest
        of the session after signing in from the VS Code extension\\n- Fixed Claude
        overwriting a very large CLAUDE.md, rules file or @-included file in a subdirectory
        after seeing only its start; Write now asks Claude to read it all or edit
        in place\\n- Fixed per-directory and `paths:` skills not being found after
        a Bash `cd` deeper into a git repository\\n- Fixed a rare case where the first
        reply after resuming a session in the terminal could be missing the next time
        the session was resumed\\n- Fixed a command with an invalid name stopping
        all commands from loading, which could leave `claude -p` with no output\\n-
        Fixed the Read tool sometimes failing on PDF pages with \\\"pdftoppm failed:
        Could not write image\\\" when the clean-up of old session files ran at the
        same time\\n- Fixed the spinner, OpenTelemetry `effort` values and transcripts
        naming a newly picked effort level during a task before the model applied
        it; they now show the level in force\\n- Fixed the `/model` and `/effort`
        cache warning saying the re-read waits for your next message; a change made
        while Claude is working can trigger it sooner\\n- Fixed some sessions showing
        as waiting on you when the last message only mentioned items waiting on you
        mid-sentence\\n- Fixed agent view restoring input text on the next launch
        after it was cleared with Ctrl+C just before exiting\\n- Fixed agent view
        reopening in shell mode after exiting with Ctrl+D from an empty `!` input\\n-
        Fixed vim mode `d`, `c` and `y` with a `gj` or `gk` count larger than the
        lines left deleting or copying text; like Vim, they now only move the cursor\\n-
        Fixed `/verify` showing a long description meant for Claude in `/help` and
        the `/` command menu instead of a short one\\n- Improved the prompt's effort
        indicator: a change made mid-task now says it may wait for your next message,
        and the note clears when it no longer applies\\n- Improved WebFetch errors
        in cloud sessions: a host that does not resolve is now explained as possibly
        outside the allowed network domains, so Claude names the host to allow\\n-
        Changed Bedrock, Vertex, Foundry and Mantle to use the shorter system prompt
        for model names Claude Code doesn't recognize, such as custom deployment names
        and inference profile ARNs, even when they front Sonnet or Haiku; set `CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0`
        to keep the full prompt\\n- Changed automatic model switches after a flagged
        message to also cover model names Claude Code doesn't recognize, such as custom
        deployment names; set `CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK=1` to turn them
        off\\n- Changed usage limit messages to call the 5-hour window the \\\"5-hour
        limit\\\" instead of the \\\"session limit\\\"\\n- Changed cloud sessions
        started from the CLI to get their names and branch names from the server\\n-
        Changed prompt and agent hooks to run at most 24 at a time per session, sub-agents
        included, plus at most 12 that have waited longer than their event's timeout;
        a `timeout` under 1 second now counts as 1 second\\n- Changed a subagent's
        `autoCompactWindow` to lower the window set by `CLAUDE_CODE_AUTO_COMPACT_WINDOW`,
        where it had no effect before; it still never raises that window\\n- Changed
        OpenTelemetry `mcp_server.name` to report the real name of fixed-URL remote
        MCP servers declared by plugins from the official Anthropic marketplace, instead
        of `custom`\\n- Changed Claude Code to stop sending the `claude_code.safety_event`
        OpenTelemetry event\\n- [VSCode] Fixed sessions ending on a bare exit code
        when your organization's settings couldn't be loaded or were refused at startup;
        the tab now says why and offers Retry or Sign in again\\n- [VSCode] Changed
        usage limit resets to show a clock time (\\\"Resets at 3:10 PM\\\") and to
        say \\\"5-hour limit\\\"\\n- [Cloud sessions] Added an effort level to the
        model picker when you create or edit a routine that runs in the cloud\\n-
        [Cloud sessions] Added a Bash editor with colors, line numbers and a Copy
        button to the setup script box in cloud environment settings\\n- [Cloud sessions]
        Improved the step shown when Claude adds a repository to a cloud session:
        opening it now shows a short table of what happened instead of raw JSON\\n-
        [Cloud sessions] Fixed resending an unchanged message after a failed send
        in a cloud session sometimes running it twice\\n- [Cloud sessions] Fixed a
        failed cloud environment creation showing its error only as a toast outside
        the open dialog; it now appears inside the dialog\\n- [Cloud sessions] Fixed
        Edit in a routine's menu on the Routines page going to the routine's page
        without opening its edit dialog\\n- [Remote Control] Fixed an unarchived Remote
        Control session showing as working until a computer reconnected; it now shows
        as idle\\n- [Claude Tag] Improved Claude Tag's retry notice in Slack to name
        the model in use, or say rate limits were hit, instead of a generic API error\\n-
        [Claude Tag] Fixed a Claude Tag channel's on/off switch and agent settings
        falling back to workspace defaults when an older private Slack channel goes
        public and gets a new ID\\n- [Claude Tag] Fixed Claude in Slack not replying
        in channels whose environment has network access set to None\\n- [Claude Tag]
        Fixed Claude in Slack sometimes posting a file in the wrong thread when it
        was answering in another thread of the same channel\\n- [Code Review] Fixed
        Code Review reviewing an outdated commit, or none at all, when GitHub delivered
        a push event late; it now reviews the pull request's current commit\\n\",\"reactions\":{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/425846009/reactions\",\"total_count\":36,\"+1\":14,\"-1\":0,\"laugh\":6,\"hooray\":5,\"confused\":0,\"heart\":4,\"rocket\":4,\"eyes\":3}},{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/424682562\",\"assets_url\":\"https://api.github.com/repos/anthropics/claude-code/releases/424682562/assets\",\"upload_url\":\"https://uploads.github.com/repos/anthropics/claude-code/releases/424682562/assets{?name,label}\",\"html_url\":\"https://github.com/anthropics/claude-code/releases/tag/v2.1.311\",\"id\":424682562,\"author\":{\"login\":\"ashwin-ant\",\"id\":178951676,\"node_id\":\"U_kgDOCqqV_A\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/178951676?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/ashwin-ant\",\"html_url\":\"https://github.com/ashwin-ant\",\"followers_url\":\"https://api.github.com/users/ashwin-ant/followers\",\"following_url\":\"https://api.github.com/users/ashwin-ant/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/ashwin-ant/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/ashwin-ant/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/ashwin-ant/subscriptions\",\"organizations_url\":\"https://api.github.com/users/ashwin-ant/orgs\",\"repos_url\":\"https://api.github.com/users/ashwin-ant/repos\",\"events_url\":\"https://api.github.com/users/ashwin-ant/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/ashwin-ant/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"node_id\":\"RE_kwDON91aY84ZUCRC\",\"tag_name\":\"v2.1.311\",\"target_commitish\":\"main\",\"name\":\"v2.1.311\",\"draft\":false,\"immutable\":true,\"prerelease\":false,\"created_at\":\"2026-10-26T21:51:04Z\",\"updated_at\":\"2026-10-26T21:51:23Z\",\"published_at\":