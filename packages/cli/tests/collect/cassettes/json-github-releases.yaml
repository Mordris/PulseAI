\"https://api.github.com/repos/anthropics/claude-code/tarball/v2.1.310\",\"zipball_url\":\"https://api.github.com/repos/anthropics/claude-code/zipball/v2.1.310\",\"body\":\"##
        What's changed\\n\\n- Added the Monitor tool and plugin monitors on Bedrock,
        Vertex, and Foundry, and when telemetry or nonessential traffic is disabled;
        long foreground sleeps are now blocked there too\\n- Fixed requests failing
        behind some gateways and compatible servers that reject the `effort-2025-11-24`
        beta value or mid-conversation system messages; Claude Code now retries without
        them\\n- Fixed background cleanup deleting some recent files, such as pasted
        images, when `cleanupPeriodDays` is set to a very large value\\n- Fixed compaction
        after a \\\"Prompt is too long\\\" error keeping too much of a conversation
        with dense text, such as base64 or SVG, so the next request could fail again\\n-
        Fixed file read permission prompts not showing where a symbolic link leads\\n-
        Fixed a question's auto-continue timeout firing the moment the external editor
        closed after a long edit\\n- Windows: Fixed PreToolUse and PermissionRequest
        hooks letting a tool call through when Git Bash is missing and the hook's
        command is only quoted strings, such as a quoted path\\n- Improved auto mode's
        prompt before the first read outside the working directories: it now says
        when blocking those reads makes shell commands ask for permission\\n- Improved
        memory use of non-interactive sessions (`-p`, Agent SDK) during compaction
        when the transcript file is very large\\n- Improved a mod's `Image` to draw
        inside tmux with `allow-passthrough` and `focus-events` on, in kitty, Ghostty,
        and iTerm2 3.5+ with fullscreen rendering, where it showed only its `alt`
        text\\n- Linux: Improved `/sandbox` and the sandbox startup warning to name
        Ubuntu's AppArmor restriction on user namespaces, and how to lift it, when
        it keeps bubblewrap from starting the sandbox\\n- Changed the error for an
        MCP tool call that times out in a non-interactive session while the server's
        elicitation is unanswered: it now tells Claude that no answer came and not
        to repeat the call\\n- [VSCode] Fixed pressing Enter on the plan review card's
        \\\"Send feedback and keep planning\\\" button approving the plan instead
        of sending your comments back\\n- [VSCode] Fixed the panel showing \\\"Something
        went wrong\\\" after \\\"Switch branch & continue\\\" on a cloud session opened
        from Session history's Web tab\\n- [Cloud sessions] Added Claude Code cloud
        sessions and Remote Control permissions to Enterprise custom roles, so Owners
        can control access to each by role\\n- [Cloud sessions] Added a Choose file
        button to load a cloud environment's setup script from a file\\n- [Cloud sessions]
        Fixed failed saves and archives in the cloud environment edit dialog showing
        no error inside the dialog\\n- [Cloud sessions] Fixed failed routine API token
        actions showing only a toast; the error now appears in the routine edit dialog\\n-
        [Cloud sessions] Improved the session start checklist to show a cloud environment's
        setup script output in a scrolling box\\n- [Cloud sessions] Changed turning
        on Cloud sessions or Remote Control in admin settings to ask for confirmation
        and list the custom roles that have that permission\\n- [Cloud sessions] Changed
        the cloud environment dialog to open network access, setup script and environment
        variables from rows instead of listing every editor at once\\n- [Claude Tag]
        Fixed Claude Tag treating `!` commands such as `!restart` and `!help` as ordinary
        messages when sent in bold, italic or strikethrough\\n- [Claude Tag] Fixed
        Claude Tag admin channel and workspace pages being replaced by a load error
        when a background refresh of the bundle list fails\\n- [Claude Tag] Fixed
        Claude Tag's spend limits page in admin settings reporting that no channels
        match a filter while channel names are still loading\\n- [Code Review] Fixed
        the Code Review admin section hiding its repositories and switches after a
        failed refresh of the repository list\\n- [Code Review] Improved the Code
        Review admin section to retry the first load and show one Try again banner
