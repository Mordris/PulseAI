\"https://api.github.com/repos/anthropics/claude-code/tarball/v2.1.311\",\"zipball_url\":\"https://api.github.com/repos/anthropics/claude-code/zipball/v2.1.311\",\"body\":\"##
        What's changed\\n\\n- Added `--hold-idle-file` and `--max-hold-min` to `self-hosted-runner`,
        to keep an idle session while your host reports processes it left running\\n-
        Added a tip for the Explanatory output style, shown when you ask Claude for
        explanations\\n- Fixed long freezes at startup and after reading or editing
        files when a CLAUDE.md file holds a very long list item\\n- Fixed interrupting
        Claude not taking effect until a timeout while an MCP server had not answered
        a resource read or a skill was still downloading\\n- Fixed standard-context
        sessions stopping with \\\"Usage credits required for 1M context\\\" when
        a request ran over 200K tokens; Claude Code now compacts the conversation
        and continues\\n- Fixed Write and Edit stalling for up to 5 seconds after
        they ran, and reporting 0 lines changed, when changing thousands of lines
        in a file\\n- Fixed subagents being unable to use MCP tools from servers that
        finish connecting after the subagent starts\\n- Fixed Claude seeing stale
        MEMORY.md and CLAUDE.md content right after automatic compaction when those
        files were edited earlier in the session\\n- Fixed `claude -p` and SDK sessions
        saving transcript messages out of order or keeping messages that were taken
        back\\n- Fixed `SubagentStop` hooks running about twice a minute for each
        running subagent instead of once when it finishes\\n- Fixed the @ file picker
        ignoring `.ignore`/`.rgignore` negation rules that re-include git-ignored
        files\\n- Fixed a subagent's isolated worktree being removed while a background
        subagent it started was still working in it\\n- Fixed background agents in
        auto mode that wait on their own shells starting a new main conversation turn
        on every wake\\n- Fixed the Bash tool description claiming the working directory
        always persists between calls\\n- Fixed the environment block naming a shell
        commands don't run in, such as fish when the Bash tool uses zsh\\n- Fixed
        `claude mcp add`, `claude mcp remove` and `/mcp` naming the current folder
        instead of the project entry in `~/.claude.json` that holds a local-scope
        server when run below a repository root\\n- Fixed `claude mcp list` and `claude
        mcp get` showing the error code twice on failed-connection lines (for example
        `ENOENT: ENOENT: \u2026`)\\n- Fixed Remote Control sessions staying on \\\"Connecting\\\"
        for about two minutes when a network proxy blocks a startup request\\n- Fixed
        messages that Claude sends to a cloud or Remote Control session appearing
        as your own message in the Claude mobile apps\\n- Fixed Claude not being told
        the cause when a file attached to a message sent over Remote Control or to
        a cloud session could not be saved because the disk was full, or that a message's
        attachments past the first 20 were left out\\n- Fixed WebFetch and WebSearch
        hanging on a stalled response in Cowork cloud sessions; an unfinished request
        now fails after 300 seconds\\n- Fixed a background session that crashed between
        turns not being restarted while it was attached, pinned, or had a scheduled
        task or wake-up set\\n- Fixed the \\\"background service did not respond\\\"
        error suggesting the disabled `claude daemon restart`; it now suggests `claude
        daemon stop --any` and says it ends background sessions\\n- Fixed `claude
        respawn <id>` starting the background service before reporting that no background
        session matches the id\\n- Fixed `/effort` not warning about a prompt cache
        miss in plan mode when the plan model differs from the session model\\n- Fixed
        `/ide` saying the VS Code extension was installed before the install finished
        or when it failed\\n- Fixed the Write tool's file preview skipping rows and
        miscounting hidden lines when a line is wider than the terminal\\n- Fixed
        \u2191 in an agent's chat tab recalling a message that was still waiting to
        be delivered, so resending it sent a second copy\\n- Fixed Cowork cloud sessions
        losing their connectors and most tools after a restart when a plugin or your
        settings named an `agent`; Cowork cloud sessions now ignore that setting\\n-
        Fixed agent teams sessions showing an empty task list when coming back with
        `--resume`, `--continue`, `/resume` or `--session-id`, including after `/clear`
        or a crash, and `/branch` writing to the original session's list\\n- Fixed
        pasting text that mentions an image file, such as `! open /tmp/shot.png` or
        `/review look at /tmp/shot.png`, attaching the image and dropping its path
        from the prompt\\n- Fixed the feedback draft card showing its 1/2/0 and Esc
        shortcuts while the prompt has text, when those keys act on the prompt instead
        of the card\\n- Fixed a lone backslash in quotes or brackets, like `\\\"\\\\\\\"`
        or `(\\\\)`, disappearing from Claude's responses\\n- Fixed agent teammates
        compacting their history when `DISABLE_COMPACT` is set\\n- Fixed the rewind
        menu offering \\\"Summarize from here\\\" and \\\"Summarize up to here\\\"
        when `DISABLE_COMPACT` is set\\n- Fixed a finished `/code-review`, or another
        skill that runs in a sub-agent, running a second time when a cloud or background
        session restarts\\n- Fixed long hidden thinking being cut off as idle on Google
        Vertex AI, Microsoft Foundry and Claude Platform on AWS, where the endpoint
        sends thinking progress updates\\n- Fixed `/ide` saying it had installed the
        JetBrains plugin when nothing was installed\\n- Fixed Claude Pro and Max subscribers
        being told to ask their admin when their subscription can't be used; the message
        now points to billing settings\\n- Fixed the diff pane opening by itself after
        an edit in wide fullscreen terminals when it had nothing to show\\n- Fixed
        `/mcp` showing a remote server as failed after \\\"Clear authentication\\\"
        when the server works without sign-in\\n- Fixed `/mcp` showing \\\"authenticated\\\"
        for a remote server that Claude Code sends no credentials to\\n- Fixed a `--plugin-dir`
        folder of plugins loading as one plugin when an empty `.mcp.json` was at its
        top\\n- Fixed `/usage` never showing large prompt-cache misses under \\\"What's
        contributing to your limits usage?\\\"\\n- Fixed status line links staying
        plain text in background sessions after you open them from a terminal that
        supports links\\n- Fixed the /rewind confirmation saying the conversation
        \\\"will be forked\\\" when the later messages are removed from the conversation\\n-
        Fixed the /rewind warning that wrongly said manual and Bash edits are never
        affected by a code restore\\n- Fixed plan approval in screen reader mode sending
        feedback you had dismissed with Escape\\n- Fixed Claude Code retrying requests
        the API marked not to retry, which could hold a turn for minutes or, in unattended
        retry mode (`CLAUDE_CODE_RETRY_WATCHDOG`), indefinitely\\n- Linux: Fixed sandboxed
        Bash commands failing with `bwrap: Can't create file` when a `--plugin-dir`
        folder was also an added directory and `permissions.blockReadsOutsideWorkingDirectories`
        was on\\n- Self-hosted runner: Fixed a session failing to start when a rate
        limit (HTTP 429, or a git wrapper that exits 75) blocks an added read-only
        repository; it now starts without that repository\\n- Improved startup time
        for Pro and Max accounts by skipping two network requests on launches within
        an hour of the last check\\n- Improved `/teleport` and `claude --teleport`
        to warn when a compacted cloud session loads from its last compaction, so
        the messages it summarized aren't in the local copy\\n- Improved the messages
        shown when a background session's process exits: they no longer promise a
        restart that isn't coming, and they say how to resume the session\\n- Improved
        artifacts with several views: Claude now routes each view on the link's `#name`
        and no longer says the address bar stays the same as you switch views\\n-
        Improved shell commands that reach their timeout: the result now shows the
        output so far and says the command is still running in the background\\n-
        Improved compaction: when the model's reply has no summary in it, Claude Code
        now usually asks for the summary once more before it replaces the conversation\\n-
        Improved the Artifact tool's choice between a page and a document: explainers
        and visual or interactive work become artifact pages; documents are for writing
        people keep editing or pass around\\n- Improved startup time for launches
        whose only arguments are options and their values, such as `claude --model
        opus`\\n- Improved the \\\"Connection dropped\\\" API error: it now says where
        to look first (the proxy or gateway in use, else VPN or firewall; Anthropic
        API only, Bedrock, Vertex and Foundry are unchanged)\\n- Improved screen reader
        mode: deleting a rule in /permissions says \\\"Deleted allow rule \u2026\\\"
        right away\\n- Improved the message shown when a pasted sign-in code is refused:
        it now says the code may have expired or been used, and to sign in again\\n-
        Improved Slack connector sends: Claude now checks a channel's topic for posting
        rules before messaging a channel you didn't name\\n- Improved screen reader
        mode: Claude's questions are listed as \\\"Questions: Color (answered), Pages\\\",
        without arrows or symbols\\n- Changed `ultrathink` in the interactive terminal
        to run its turn at xhigh effort on Opus 5.5, Sonnet 5.5, Haiku 5.5 and Fable
        5.1 through Anthropic's API; typed while Claude is working, it raises the
        rest of that turn\\n- Changed the `ultrathink` rainbow to appear only where
        the keyword can raise effort, and not when the word is quoted or part of a
        file path\\n- Changed Ctrl+D in agent view to match the prompt: on an empty
        input, pressing it twice exits\\n- Changed `--output-format json` and `stream-json`
        output to write DEL, C1 control and Unicode format characters inside strings
        as `\\\\uXXXX` escapes; parsed values are unchanged\\n- Changed model names
        and IDs to drop the `[1m]` suffix and its label on models where the suffix
        has no effect; the suffix is still accepted\\n- Changed startup warnings about
        permission rules in settings files to show once per user until the rule changes\\n-
        Changed `/code-review` to tell Claude to put the effort level first and use
        max only when asked\\n- Changed `DISABLE_COMPACT` in settings files and in
        a mod's `$.env.set` so they can only turn compaction off, not back on\\n-
        Changed Claude Code on Bedrock, Mantle, Vertex, and Foundry to load model
        settings from a signed file on downloads.claude.ai; set CLAUDE_CODE_MODEL_CATALOG=off
        to turn this off\\n- Changed sessions that set `CLAUDE_CODE_SYNC_SKILLS` with
        feature-flag fetching off to reuse a claude.ai skills list up to 10 minutes
        old that another session on the machine fetched\\n- Changed clicks on scrollbar
        arrows and bars in fullscreen lists to act when the mouse button is released,
        so moving off the scrollbar before letting go cancels the click\\n- Changed
        `claude purge` to say it deletes data only on this computer, not anything
        stored by Anthropic\\n- [VSCode] Added syntax coloring to code blocks in Claude's
        replies, in light, dark and high contrast dark themes\\n- [VSCode] Added a
        \\\"Running UserPromptSubmit hooks\\\" spinner status and screen reader announcement
        for slow UserPromptSubmit hooks\\n- [VSCode] Fixed custom skills and custom
        slash commands sent from the VS Code or JetBrains panel leaving out the open
        file or selected lines that ordinary messages include (anthropics/claude-code#102799)\\n-
        [VSCode] Fixed the extension host freezing while the login shell ran its start-up
        files to read PATH on macOS and Linux\\n- [VSCode] Fixed clicking an image
        in a tool result, or closing its preview, also opening the result's text in
        an editor tab\\n- [VSCode] Fixed voice dictation continuing to record after
        a message was sent with the Send button; sending now stops dictation first,
        as pressing Enter already did\\n- [VSCode] Changed the extension to start
        Claude Code sessions with `DISABLE_TELEMETRY` set while VS Code's telemetry
        setting is off, so they send no usage metrics or error reports and fetch no
        feature flags\\n- [VSCode] Changed the session list side bar to load Web sessions
        when the Web tab is first opened, not at startup\\n- [Cloud sessions] Fixed
        routines in Anthropic-hosted environments staying locked after their owner
        left the organization and rejoined; the owner can now turn them back on\\n-
        [Cloud sessions] Fixed a failed routine API token delete or regenerate showing
        nothing if the edit dialog had already closed; it now shows an error toast\\n-
        [Cloud sessions] Fixed cloud environment dialogs, including the admin dialog,
        accepting duplicate names; they now refuse a name another listed environment
        already has\\n- [Claude Tag] Added a Skills view to Claude Tag analytics showing
        how often Claude runs each attached skill in Slack channels and which go unused,
        with Usage links in admin settings\\n- [Claude Tag] Improved Claude Tag routines
        that run in a new session: a run with nothing to report can now end without
        posting a throwaway message to the channel\\n- [Claude Tag] Changed Claude
        Tag admin settings to show a lock instead of # for private Slack channels
        that your own Slack account can see\\n- [Code Review] Improved Code Review's
        check run to say no further automatic review will start when the model still
        can't analyze a change on the automatic retry\\n- [Code Review] Improved Code
        Review reliability: a review whose session fails to start because of a transient
        server fault is now retried once automatically, and its check run says so\\n\",\"reactions\":{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/424682562/reactions\",\"total_count\":41,\"+1\":13,\"-1\":0,\"laugh\":4,\"hooray\":7,\"confused\":0,\"heart\":6,\"rocket\":6,\"eyes\":5}},{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/422315867\",\"assets_url\":\"https://api.github.com/repos/anthropics/claude-code/releases/422315867/assets\",\"upload_url\":\"https://uploads.github.com/repos/anthropics/claude-code/releases/422315867/assets{?name,label}\",\"html_url\":\"https://github.com/anthropics/claude-code/releases/tag/v2.1.310\",\"id\":422315867,\"author\":{\"login\":\"ashwin-ant\",\"id\":178951676,\"node_id\":\"U_kgDOCqqV_A\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/178951676?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/ashwin-ant\",\"html_url\":\"https://github.com/ashwin-ant\",\"followers_url\":\"https://api.github.com/users/ashwin-ant/followers\",\"following_url\":\"https://api.github.com/users/ashwin-ant/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/ashwin-ant/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/ashwin-ant/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/ashwin-ant/subscriptions\",\"organizations_url\":\"https://api.github.com/users/ashwin-ant/orgs\",\"repos_url\":\"https://api.github.com/users/ashwin-ant/repos\",\"events_url\":\"https://api.github.com/users/ashwin-ant/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/ashwin-ant/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"node_id\":\"RE_kwDON91aY84ZLAdb\",\"tag_name\":\"v2.1.310\",\"target_commitish\":\"main\",\"name\":\"v2.1.310\",\"draft\":false,\"immutable\":true,\"prerelease\":false,\"created_at\":\"2026-10-23T23:38:44Z\",\"updated_at\":\"2026-10-23T23:39:00Z\",\"published