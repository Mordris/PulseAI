"https://api.github.com/repos/anthropics/claude-code/tarball/v2.1.305\",\"zipball_url\":\"https://api.github.com/repos/anthropics/claude-code/zipball/v2.1.305\",\"body\":\"##
        What's changed\\n\\n- Added `sandbox.allowNestedUserNamespaces` so sandboxed
        commands on Linux can create user namespaces (Chromium, rootless podman);
        this lets them get around the sandbox's file protections\\n- Added `CLAUDE_CODE_RETRY_WATCHDOG_USAGE_LIMIT_RECHECK_MS`
        so unattended retry mode (`CLAUDE_CODE_RETRY_WATCHDOG`) notices a usage limit
        that was lifted before its reset\\n- Fixed every request failing on Vertex,
        Bedrock and other providers when the endpoint or a gateway rejects tool search,
        and behind gateways with ToolSearch disallowed or left out of `--tools` (a
        2.1.304 regression): Claude Code now retries without it\\n- Fixed `/effort`
        and `/autocompact` settings not applying when the model name differed from
        a `modelOverrides` value by letter case or a `[1m]` tag\\n- Fixed new worktrees
        in a bare repository sometimes starting from local HEAD instead of the default
        branch, and unchanged subagent worktrees sometimes not being cleaned up\\n-
        Fixed Bash commands on a full disk failing with a raw `ENOSPC` file path:
        the error now says the disk is full and that nothing ran\\n- Fixed an MCP
        server passed by a cloud session or by the SDK's `setMcpServers` being replaced
        later in the session by a same-named server from your own settings\\n- Fixed
        Claude naming the wrong model for a subagent's work after the subagent switched
        to a fallback model\\n- Fixed cloud sessions and teammates not telling Claude
        when a compaction had to leave the oldest messages out of its summary to fit\\n-
        Fixed more cases of scheduled Cowork cloud sessions waiting five minutes for
        each subagent whose WebFetch needed a URL approval that nobody was there to
        give\\n- Fixed Workflow resume re-running already-completed `pipeline()` and
        `parallel()` agents instead of serving them from the run's journal\\n- Fixed
        Remote Control leaving empty \\\"(session)\\\" entries in `/resume` after
        switching conversations with `/resume`\\n- Fixed `/usage` rows being cut off
        in narrow terminals\\n- Fixed startup warnings printing as raw text above
        the logo: they now go to the debug log, and permission rules that restrict
        nothing show as warning rows under the banner\\n- Fixed screen reader mode:
        search boxes now say \\\"Search:\\\" instead of a symbol VoiceOver read as
        \\\"telephone recorder\\\", and highlighted prompt text, such as Ctrl+R search
        matches and \\\"ultrathink\\\", no longer has spaces inside words\\n- Self-hosted
        runner: Fixed a start script that shares only its stdout with the runner or
        orchestrator failing with `Resource temporarily unavailable` when `TERM` is
        set (a 2.1.300 regression)\\n- Self-hosted runner: Fixed repository access
        failing since 2.1.296 when a git credential helper or askpass program reads
        its settings through `GIT_CONFIG`\\n- Self-hosted runner: Fixed the orchestrator
        reporting a spawn-runner hook as timed out when a runner it started in the
        background kept its output open\\n- Improved `/usage`: each warning is now
        a one-line fix that names its source, and `f` applies the fixes; the same
        fixes appear in VS Code and `/doctor`\\n- Improved MCP consent dialogs so
        an Enter meant for the prompt is less likely to be taken as Accept\\n- Improved
        a mod's `Image` to draw its picture in iTerm2 3.5 and later with fullscreen
        rendering, where it showed only its `alt` text\\n- Remote Control: Improved
        the spawn-mode messages: pressing `w` now says the new mode is saved for the
        folder, and a later `claude remote-control` start that uses the saved mode
        says where it came from\\n- Changed `allowedMcpServers` to stop filtering
        `managed-mcp.json` stdio servers that use `${VAR}` only in `env`: one your
        allowlist left out now loads on upgrade; use `deniedMcpServers` to keep it
        off\\n- Changed plugins that Claude Desktop mounts by path to no longer keep
        their `allowed-tools` when your organization's managed settings set `allowManagedPermissionRulesOnly`\\n-
        Changed the `/artifacts` delete confirmation to take 1 or Enter to keep, 2
        to delete, and Esc to cancel; `y` and `n` no longer answer it\\n- Changed
        a mod's docked pane to stay within 45% of the terminal's width, including
        a width kept from a wider terminal\\n- [VSCode] Added a \\\"Running start-up
        hooks\\\" spinner status, with a screen reader announcement, while SessionStart
        or Setup hooks run\\n- [VSCode] Fixed the spinner cutting off \\\"Compacting...\\\"
        when your `spinnerVerbs` setting replaces the built-in verbs with short ones\\n-
        [VSCode] Changed the message shown when a session does not start in time and
        no hook is running: it now leads with the output logs and lists causes instead
        of pointing to sign-in and network first\\n- [Cloud sessions] Fixed the Cloud
        environments admin page wrongly refusing to save an existing environment with
        an \\\"installs packages\\\" error\\n- [Cloud sessions] Improved deleting
        a self-hosted environment so the dialog and error messages say what blocks
        the delete and what it will affect\\n- [Claude Tag] Added public Slack channels
        Claude hasn't joined to the Claude Tag admin Add place search, so admins can
        set one up from there\\n- [Claude Tag] Fixed Claude Tag access bundles so
        a repository that moved to another GitHub account can be added again\\n- [Claude
        Tag] Fixed a routine set up in a Slack DM thread no longer posting after another
        routine in that thread restarted the conversation; both now keep posting there\\n-
        [Claude Tag] Fixed routines set up in a Slack thread reporting success without
        posting after the conversation ended; those runs are now skipped and the creator
        is told\\n- [Claude Tag] Improved Claude Tag admin pages in large organizations
        so plugin, skill and bundle edits work while the channel list is still loading\\n-
        [Code Review] Fixed Code Review sometimes not reviewing the newest commit
        when several pushes landed on a pull request during a review\\n- [Code Review]
        Changed Code Review re-reviews so they no longer open with LGTM while earlier
        blocking findings are still open\\n\",\"reactions\":{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/418781864/reactions\",\"total_count\":28,\"+1\":14,\"-1\":0,\"laugh\":2,\"hooray\":3,\"confused\":0,\"heart\":2,\"rocket\":4,\"eyes\":3}},{\"url\":\"https://api.github.com/repos/anthropics/claude-code/releases/417677344\",\"assets_url\":\"https://api.github.com/repos/anthropics/claude-code/releases/417677344/assets\",\"upload_url\":\"https://uploads.github.com/repos/anthropics/claude-code/releases/417677344/assets{?name,label}\",\"html_url\":\"https://github.com/anthropics/claude-code/releases/tag/v2.1.304\",\"id\":417677344,\"author\":{\"login\":\"ashwin-ant\",\"id\":178951676,\"node_id\":\"U_kgDOCqqV_A\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/178951676?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/ashwin-ant\",\"html_url\":\"https://github.com/ashwin-ant\",\"followers_url\":\"https://api.github.com/users/ashwin-ant/followers\",\"following_url\":\"https://api.github.com/users/ashwin-ant/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/ashwin-ant/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/ashwin-ant/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/ashwin-ant/subscriptions\",\"organizations_url\":\"https://api.github.com/users/ashwin-ant/orgs\",\"repos_url\":\"https://api.github.com/users/ashwin-ant/repos\",\"events_url\":\"https://api.github.com/users/ashwin-ant/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/ashwin-ant/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"node_id\":\"RE_kwDON91aY84Y5UAg\",\"tag_name\":\"v2.1.304\",\"target_commitish\":\"main\",\"name\":\"v2.1.304\",\"draft\":false,\"immutable\":true,\"prerelease\":false,\"created_at\":\"2026-10-19T21:34:21Z\",\"updated_at\":\"2026-10-19T21:34:39Z\",\"published_at\":\"2026-10-19T21:34:39Z\",\"assets\"