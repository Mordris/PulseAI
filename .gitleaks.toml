title = "PulseAI gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "apprise-notification-url"
description = "Apprise URL with an embedded long credential (tgram://, discord://, slack://, ...); env-var references such as $TOKEN or ${TOKEN} are not matched"
regex = '''(?i)\b(?:tgram|discord|slack|mailtos?|ntfys?|pover|pbul|matrixs?|gotifys?|msteams|rockets?)://[^\s'"$<>{}]*[A-Za-z0-9_-]{16,}[^\s'"]*'''
keywords = ["tgram://", "discord://", "slack://", "mailto://", "mailtos://", "ntfy://", "ntfys://", "pover://", "pbul://", "matrix://", "matrixs://", "gotify://", "gotifys://", "msteams://", "rocket://", "rockets://"]

[[rules]]
id = "apprise-url-userinfo"
description = "Apprise URL with user:password@ credentials (mailto://, ntfy://, matrix://, gotify://, rocket://); catches short passwords"
regex = '''(?i)\b(?:mailtos?|ntfys?|matrixs?|gotifys?|rockets?)://[^\s'"/:@$<>{}]+:[^\s'"/@$<>{}]{4,}@'''
keywords = ["mailto://", "mailtos://", "ntfy://", "ntfys://", "matrix://", "matrixs://", "gotify://", "gotifys://", "rocket://", "rockets://"]

[[rules]]
id = "claude-code-oauth-token"
description = "Claude Code long-lived OAuth token"
regex = '''sk-ant-oat\d{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "routine-fire-token"
description = "Claude routine API trigger token"
regex = '''trig_[A-Za-z0-9]{20,}'''
keywords = ["trig_"]

[allowlist]
description = "Documentation placeholders"
regexes = ['''sk-ant-oat01-xxxxx''', '''trig_01ABCDEFGHJKLMNOPQRSTUVW''', '''mailtos?://user:pass@''']
