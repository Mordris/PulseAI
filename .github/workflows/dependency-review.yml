name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0,
            PSF-2.0, Python-2.0, Unlicense, CC0-1.0, BlueOak-1.0.0, Zlib, OFL-1.1
          # Packages whose license GitHub misdetects. Each one's declared license (PyPI
          # license_expression) is in the allow list above; re-verify when adding entries.
          #   typing-extensions: PSF-2.0 (detected as "... AND GPL-1.0-or-later ...")
          #   rfc3987-syntax:    MIT     (detected as "Apache-2.0 AND GPL-1.0-or-later AND MIT")
          #   pulseai:           MIT     (this repository's own package; not detected)
          # OFL-1.1 above covers the Fontsource font packages the site bundles.
          allow-dependencies-licenses: >-
            pkg:pypi/typing-extensions, pkg:pypi/rfc3987-syntax, pkg:pypi/pulseai
